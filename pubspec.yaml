    - assets/images/electricite.png
    - assets/images/garde_d'enfants.png
    - assets/images/informatique.png
    - assets/images/jardinage.png
    - assets/images/mécanique.png
    - assets/images/menuiserie.png
    - assets/images/peinture.png
    - assets/images/plomberie.png
    - assets/images/default_avatar.png
    - assets/images/onBoarding_1.png
    - assets/images/onBoarding_2.png
    - assets/images/onBoarding_3.png
    - assets/logos/white_logo.png
    - assets/logos/black_logo.png
